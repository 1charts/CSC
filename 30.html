<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iron & Steel Companies | CSC</title>
  <link rel="icon" type="image/png" href="https://commoditysupercycle.com/assets/logo192-C5BlHOLs.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      background: #1E1E1E; 
      font-family: 'Inter', sans-serif; 
      color: #e2e8f0; 
      overflow: hidden; 
      height: 100dvh; 
      width: 100vw; 
    }

    #rotate-message { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: #1E1E1E; 
      z-index: 999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
    }

    @media (orientation: portrait) { 
      #rotate-message { display: flex; } 
    }

    .container { 
      width: 100%; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
    }

    .header-row { 
      display: flex; 
      justify-content: flex-end; 
      align-items: center; 
      flex-shrink: 0; 
      padding: 8px 10px; 
      position: absolute; 
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: transparent;
      pointer-events: none;
    }

    .title-group { 
      flex: 1; 
      min-width: 0; 
      padding-left: 8px; 
      padding-right: 70px; 
    }

    .title { 
      font-size: 15px; 
      font-weight: 700; 
      color: #f8fafc; 
      margin: 0; 
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle { 
      font-size: 11px; 
      color: #67e8f9; 
      text-decoration: none; 
      font-weight: bold; 
    }

    .sources { 
      font-size: 10px; 
      color: #94a3b8; 
    }

    .sources a { 
      color: #67e8f9; 
      text-decoration: none; 
    }

    #full-capture-area { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      background: #1E1E1E; 
      padding: 0; 
      margin: 0;
      height: 100%;
    }

    .chart-container { 
      flex-grow: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 0;
      margin-top: 0;
      width: 100%;
      height: 100%;
    }

    img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      image-rendering: crisp-edges; 
      margin: 0;
      display: block;
    }

    /* ==================== STILI MOBILE CSC PREMIUM (solo sotto 1280px) ==================== */
    @media (max-width: 1279px) {
      .header-row {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 30;
        background: transparent;
        pointer-events: none;
      }

      .title-group {
        background: linear-gradient(180deg, rgba(22,30,42,0.96), rgba(12,18,28,0.94));
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 14px;
        padding: 12px 15px;
        max-width: 68%;
        box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
        cursor: grab;
        user-select: none;
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 50;
      }

      .title {
        font-size: 15px;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin: 0;
      }

      .subtitle, .sources {
        display: none !important;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 9px;
        align-items: flex-end;
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 40;
        pointer-events: auto;
      }

      .btn {
        background: linear-gradient(180deg, rgba(22,30,42,0.96), rgba(10,18,28,0.94));
        border: 1px solid rgba(255,255,255,0.07);
        color: #f8fafc;
        width: 50px;
        height: 50px;
        padding: 0;
        border-radius: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.03);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .btn:active {
        transform: scale(0.95);
        border-color: rgba(34,211,238,0.18);
        background: linear-gradient(180deg, rgba(34,211,238,0.10), rgba(10,18,28,0.95));
        box-shadow: 0 4px 14px rgba(0,0,0,0.25), 0 0 12px rgba(34,211,238,0.10);
      }

      .btn:hover {
        border-color: rgba(34,211,238,0.15);
      }

      .btn svg {
        width: 23px;
        height: 23px;
        fill: currentColor;
      }

      .btn.nav-btn {
        color: #22d3ee;
      }

      .btn.nav-btn svg {
        width: 26px;
        height: 26px;
        stroke: currentColor;
        stroke-width: 2.5;
        fill: none;
      }

      #full-capture-area {
        padding-right: 74px;
        padding-left: 8px;
      }

      .chart-container {
        justify-content: center;
        align-items: center;
      }

      .chart-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 14px 36px rgba(0,0,0,0.40), 0 0 0 1px rgba(255,255,255,0.03);
      }
    }

    @media (max-width: 1279px) and (hover: none) and (pointer: coarse) {
      #prev-btn, #next-btn {
        display: none !important;
      }
    }

    /* ==================== DESKTOP CSC PREMIUM (≥ 1280px) ==================== */
    @media (min-width: 1280px) {

      body {
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.025), transparent 28%),
          radial-gradient(circle at bottom right, rgba(255,255,255,0.018), transparent 30%),
          linear-gradient(180deg, #050505 0%, #0a0a0a 38%, #121212 100%);
      }

      .container {
        padding: 30px;
        gap: 22px;
      }

      .header-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;

        width: 100%;
        min-height: 108px;

        padding: 24px 32px;

        border-radius: 26px;

        background:
          linear-gradient(180deg,
            rgba(20,20,20,0.96),
            rgba(10,10,10,0.94));

        border: 1px solid rgba(255,255,255,0.05);

        box-shadow:
          0 18px 50px rgba(0,0,0,0.62),
          inset 0 1px 0 rgba(255,255,255,0.025);

        overflow: hidden;

        pointer-events: none;
      }

      .title-group,
      .title-group *,
      .actions,
      .actions * {
        pointer-events: auto;
      }

      .header-row::before {
        content: '';
        position: absolute;
        inset: 0;

        background:
          linear-gradient(90deg,
            rgba(255,255,255,0.02),
            transparent 36%,
            transparent 64%,
            rgba(255,255,255,0.015));

        pointer-events: none;
      }

      .title-group {
        position: relative;
        z-index: 2;

        flex: 1;
        max-width: 72%;

        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .title {
        font-size: 42px;
        line-height: 1.06;

        font-weight: 800;
        letter-spacing: -0.035em;

        color: #f5f5f5;

        margin: 0 0 14px 0;

        white-space: normal;
        overflow: visible;
        text-overflow: unset;

        text-shadow: 0 2px 22px rgba(0,0,0,0.55);
      }

      .subtitle {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        color: #d6d6d6;

        margin-bottom: 10px;

        transition: opacity 0.2s ease;
      }

      .subtitle:hover {
        opacity: 0.82;
      }

      .subtitle::before {
        content: '';

        width: 7px;
        height: 7px;

        border-radius: 999px;

        background: #ffffff;

        box-shadow: 0 0 10px rgba(255,255,255,0.45);
      }

      .sources {
        display: block;

        font-size: 13px;
        line-height: 1.7;

        color: #8b8b8b;

        max-width: 1000px;
      }

      .sources a {
        color: #dcdcdc;
        text-decoration: none;

        transition:
          color 0.2s ease,
          opacity 0.2s ease;
      }

      .sources a:hover {
        color: #ffffff;
      }

      .actions {
        position: relative;
        z-index: 2;

        display: flex;
        align-items: center;
        gap: 10px;

        padding: 10px;

        border-radius: 20px;

        background: rgba(255,255,255,0.025);

        border: 1px solid rgba(255,255,255,0.05);

        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.02),
          0 8px 24px rgba(0,0,0,0.35);
      }

      .btn {
        position: relative;

        width: 50px;
        height: 50px;

        border-radius: 15px;

        border: 1px solid rgba(255,255,255,0.06);

        background:
          linear-gradient(180deg,
            rgba(36,36,36,0.96),
            rgba(18,18,18,0.96));

        color: #f5f5f5;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition:
          transform 0.18s ease,
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-2px);

        border-color: rgba(255,255,255,0.14);

        background:
          linear-gradient(180deg,
            rgba(52,52,52,0.98),
            rgba(22,22,22,0.98));

        box-shadow:
          0 12px 28px rgba(0,0,0,0.45),
          0 0 22px rgba(255,255,255,0.04);
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .btn.nav-btn {
        color: #f0f0f0;
      }

      .btn.nav-btn svg {
        width: 26px;
        height: 26px;
        stroke: currentColor;
        stroke-width: 2.4;
        fill: none;
      }

      .actions div[style*='width:1px'] {
        width: 1px !important;
        height: 30px !important;
        background: rgba(255,255,255,0.08) !important;
        margin: 0 2px !important;
      }

      #full-capture-area {
        position: relative;

        overflow: hidden;

        border-radius: 28px;

        background:
          linear-gradient(180deg,
            rgba(18,18,18,0.98),
            rgba(8,8,8,0.98));

        border: 1px solid rgba(255,255,255,0.05);

        box-shadow:
          0 30px 70px rgba(0,0,0,0.70),
          inset 0 1px 0 rgba(255,255,255,0.015);
      }

      #full-capture-area::before {
        content: '';

        position: absolute;
        inset: 0;

        background:
          linear-gradient(180deg,
            rgba(255,255,255,0.015),
            transparent 18%);

        pointer-events: none;
      }

      .chart-container {
        position: relative;

        display: flex;
        justify-content: center;
        align-items: center;

        width: 100%;
        height: 100%;

        padding: 42px;
      }

      .chart-container img {
        width: auto;
        height: auto;

        max-width: 100%;
        max-height: calc(100vh - 255px);

        object-fit: contain;

        border-radius: 16px;

        box-shadow:
          0 26px 80px rgba(0,0,0,0.72),
          0 0 0 1px rgba(255,255,255,0.025);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .chart-container img:hover {
        transform: scale(1.006);

        box-shadow:
          0 38px 100px rgba(0,0,0,0.82),
          0 0 0 1px rgba(255,255,255,0.04);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.10);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.18);
      }
    }
  </style>
</head>

    const getName = () => window.location.pathname.split('/').pop().replace('.html', '') || chartsData[0].name;
    let currentIndex = Math.max(0, chartsData.findIndex(c => c.name === getName()));

    function updatePage() {
      const c = chartsData[currentIndex];
      const validSources = (c.sources || []).filter(s => s.text && s.text.trim() !== '');

      document.getElementById('page-title').textContent = c.title;

      const sInline = document.getElementById('source-inline');
      sInline.innerHTML = validSources.length 
        ? '<span class="source-label">Sources:</span> ' + 
          validSources.map(s => '<a href="' + s.link + '" target="_blank">' + s.text + '</a>').join(' · ')
        : '';

      document.getElementById('chart-image').src = 'charts/' + c.file;

      const url = 'https://1charts.github.io/CSC/' + c.name + '.html';
      const txt = encodeURIComponent(c.title + ' - via @CommodityCSC');

      document.getElementById('twitter-share').href = 'https://twitter.com/intent/tweet?url=' + url + '&text=' + txt;
      document.getElementById('fb-share').href = 'https://www.facebook.com/sharer/sharer.php?u=' + url;

      document.getElementById('prev-btn').style.display = currentIndex > 0 ? 'flex' : 'none';
      document.getElementById('next-btn').style.display = currentIndex < chartsData.length - 1 ? 'flex' : 'none';
      document.title = c.title + ' | CSC';

      makeTitleDraggable();
    }

    function navigateTo(idx) {
      if (idx < 0 || idx >= chartsData.length) return;
      currentIndex = idx;
      updatePage();
      history.pushState({index: currentIndex}, '', chartsData[currentIndex].name + '.html');
    }

    const navigatePrev = () => navigateTo(currentIndex - 1);
    const navigateNext = () => navigateTo(currentIndex + 1);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.code === 'Space') { e.preventDefault(); navigateNext(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); navigatePrev(); }
    });

    let tsX = 0;
    const area = document.getElementById('full-capture-area');
    area.addEventListener('touchstart', e => {
      if (e.touches.length === 1) tsX = e.touches[0].screenX;
    }, { passive: true });

    area.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].screenX - tsX;
        if (Math.abs(dx) > 60) {
          if (dx < -60) navigateNext();
          else if (dx > 60) navigatePrev();
        }
      }
    });

    window.onpopstate = () => {
      currentIndex = Math.max(0, chartsData.findIndex(c => c.name === getName()));
      updatePage();
    };

    function makeTitleDraggable() {
      const titleGroup = document.querySelector('.title-group');
      if (!titleGroup || window.innerWidth >= 1280) return;

      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      titleGroup.style.position = 'absolute';
      titleGroup.style.zIndex = '50';
      titleGroup.style.cursor = 'grab';

      titleGroup.addEventListener('touchstart', (e) => {
        isDragging = true;
        const rect = titleGroup.getBoundingClientRect();
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
        titleGroup.style.transition = 'none';
        titleGroup.style.cursor = 'grabbing';
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;
        const maxLeft = window.innerWidth - titleGroup.offsetWidth - 10;
        const maxTop = window.innerHeight - titleGroup.offsetHeight - 10;
        newLeft = Math.max(10, Math.min(newLeft, maxLeft));
        newTop = Math.max(10, Math.min(newTop, maxTop));
        titleGroup.style.left = newLeft + 'px';
        titleGroup.style.top = newTop + 'px';
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          titleGroup.style.cursor = 'grab';
          titleGroup.style.transition = 'left 0.15s ease, top 0.15s ease';
        }
      });
    }

    window.onload = () => { updatePage(); };

    const toggleFullScreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    function takeScreenshot() {
      const c = chartsData[currentIndex];
      const validSources = (c.sources || []).filter(s => s.text && s.text.trim() !== '');
      const img = document.getElementById('chart-image');
      
      const preload = new Image();
      preload.crossOrigin = "anonymous";
      preload.src = img.src;

      preload.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        const WIDTH = 1450;
        const PADDING_X = 60;
        const PADDING_TOP = 80;
        const PADDING_BOTTOM = 100;
        const TITLE_HEIGHT = 85;
        const SUBTITLE_HEIGHT = 45;
        const SOURCES_HEIGHT = validSources.length ? 55 : 0;

        canvas.width = WIDTH;
        canvas.height = PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + SOURCES_HEIGHT + preload.height * (WIDTH - 2 * PADDING_X) / preload.width + PADDING_BOTTOM;

        ctx.fillStyle = '#1E1E1E';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 42px Inter';
        ctx.textAlign = 'left';
        ctx.fillText(c.title, PADDING_X, PADDING_TOP + 52);

        ctx.fillStyle = '#67e8f9';
        ctx.font = '600 32px Inter';
        ctx.fillText('commoditysupercycle.com', PADDING_X, PADDING_TOP + TITLE_HEIGHT + 28);

        if (validSources.length) {
          ctx.fillStyle = '#f8fafc';
          ctx.font = '500 22px Inter';
          ctx.fillText('Sources:', PADDING_X, PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + 30);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '500 22px Inter';
          ctx.fillText(validSources.map(s => s.text).join(' · '), PADDING_X + 100, PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + 30);
        }

        const imgX = PADDING_X;
        const imgY = PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + SOURCES_HEIGHT;
        const imgW = WIDTH - 2 * PADDING_X;
        const imgH = preload.height * (imgW / preload.width);
        
        ctx.drawImage(preload, imgX, imgY, imgW, imgH);

        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = c.name + '_CSC.png';
        link.href = dataUrl;
        link.click();
      };
    }
  </script>
