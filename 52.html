<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fertilizers & Salt Companies | CSC</title>
  <link rel="icon" type="image/png" href="https://commoditysupercycle.com/assets/logo192-C5BlHOLs.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      background: #1E1E1E; 
      font-family: 'Inter', sans-serif; 
      color: #e2e8f0; 
      overflow: hidden; 
      height: 100dvh; 
      width: 100vw; 
    }

    #rotate-message { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: #1E1E1E; 
      z-index: 999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
    }

    @media (orientation: portrait) { 
      #rotate-message { display: flex; } 
    }

    .container { 
      width: 100%; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
    }

    .header-row { 
      display: flex; 
      justify-content: flex-end; 
      align-items: center; 
      flex-shrink: 0; 
      padding: 8px 10px; 
      position: absolute; 
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      background: transparent;
      pointer-events: none;
    }

    .title-group { 
      flex: 1; 
      min-width: 0; 
      padding-left: 8px; 
      padding-right: 70px; 
    }

    .title { 
      font-size: 15px; 
      font-weight: 700; 
      color: #f8fafc; 
      margin: 0; 
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle { 
      font-size: 11px; 
      color: #67e8f9; 
      text-decoration: none; 
      font-weight: bold; 
    }

    .sources { 
      font-size: 10px; 
      color: #94a3b8; 
    }

    .sources a { 
      color: #67e8f9; 
      text-decoration: none; 
    }

    #full-capture-area { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      background: #1E1E1E; 
      padding: 0; 
      margin: 0;
      height: 100%;
    }

    .chart-container { 
      flex-grow: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 0;
      margin-top: 0;
      width: 100%;
      height: 100%;
    }

    img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      image-rendering: crisp-edges; 
      margin: 0;
      display: block;
    }

    /* ==================== STILI MOBILE (solo sotto 1280px) ==================== */
    @media (max-width: 1279px) {
      .header-row {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 30;
        background: transparent;
        pointer-events: none;
      }

      .title-group {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px 14px;
        max-width: 68%;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        pointer-events: auto;
        cursor: grab;
        user-select: none;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 50;
      }

      .subtitle, .sources {
        display: none !important;
      }

      .actions { 
        display: flex;
        flex-direction: column; 
        gap: 6px; 
        align-items: flex-end;
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 40;
        pointer-events: auto;
      }

      .btn { 
        background: #2a2a2a; 
        border: 1px solid #444; 
        color: #f8fafc; 
        padding: 9px;           
        border-radius: 8px;      
        cursor: pointer; 
        display: flex; 
        align-items: center; 
      }

      .btn:hover { background: #383838; }

      .btn svg { 
        width: 24px;             
        height: 24px;            
        fill: currentColor; 
      }

      .btn.nav-btn { 
        color: #67e8f9; 
        padding: 7px 10px;       
      }

      .btn.nav-btn svg { 
        width: 26px;             
        height: 26px;            
        stroke: currentColor; 
        stroke-width: 2.5; 
        fill: none; 
      }
    }

    @media (max-width: 1279px) and (hover: none) and (pointer: coarse) {
      #prev-btn, #next-btn { 
        display: none !important; 
      }
    }

    /* ==================== DESKTOP (≥ 1280px) - RIPRISTINATO ESATTAMENTE COME PRIMA ==================== */
    @media (min-width: 1280px) {
      .header-row {
        position: static;
        background: transparent;
        box-shadow: none;
        height: auto;           
        min-height: 100px;       
        padding-top: 90px;      
        padding-left: 12%;      
        padding-right: 12%;     
        margin-bottom: 0px;    
        justify-content: space-between;
        pointer-events: auto;
      }

      .title-group { 
        padding-left: 0; 
        padding-right: 0;
        background: transparent;
        border: none;
        box-shadow: none;
        position: static;
        cursor: default;
      }

      .title { 
        font-size: 36px;           
        font-weight: 700;          
        color: #f8fafc;            
        margin: 0 0 8px 0;
      }

      .subtitle { 
        font-size: 24px;           
        color: #67e8f9; 
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }

      .sources {
        font-size: 15px;         
        color: #94a3b8;
        display: block;
      }

      /* Pulsanti orizzontali + dimensioni originali desktop */
      .actions {
        position: static !important;
        display: flex !important;
        flex-direction: row !important;
        gap: 12px !important;
        align-items: center !important;
      }

      .btn { 
        padding: 6px; 
      }
      .btn svg { 
        width: 18px; 
        height: 18px; 
      }
      .btn.nav-btn { 
        padding: 4px 8px; 
      }
      .btn.nav-btn svg { 
        width: 22px; 
        height: 22px; 
      }

      #full-capture-area {
        padding: 15px;
      }

      .chart-container {
        justify-content: center;
        align-items: flex-start;
        padding-bottom: 60px;
      }

      .chart-container img {
        max-width: 90%;
        max-height: 100%;
      }
    }
  </style>
</head>

    const getName = () => window.location.pathname.split('/').pop().replace('.html', '') || chartsData[0].name;
    let currentIndex = Math.max(0, chartsData.findIndex(c => c.name === getName()));

    function updatePage() {
      const c = chartsData[currentIndex];
      const validSources = (c.sources || []).filter(s => s.text && s.text.trim() !== '');

      document.getElementById('page-title').textContent = c.title;

      const sInline = document.getElementById('source-inline');
      sInline.innerHTML = validSources.length 
        ? '<span class="source-label">Sources:</span> ' + 
          validSources.map(s => '<a href="' + s.link + '" target="_blank">' + s.text + '</a>').join(' · ')
        : '';

      document.getElementById('chart-image').src = 'charts/' + c.file;

      const url = 'https://1charts.github.io/CSC/' + c.name + '.html';
      const txt = encodeURIComponent(c.title + ' - via @CommodityCSC');

      document.getElementById('twitter-share').href = 'https://twitter.com/intent/tweet?url=' + url + '&text=' + txt;
      document.getElementById('fb-share').href = 'https://www.facebook.com/sharer/sharer.php?u=' + url;

      document.getElementById('prev-btn').style.display = currentIndex > 0 ? 'flex' : 'none';
      document.getElementById('next-btn').style.display = currentIndex < chartsData.length - 1 ? 'flex' : 'none';
      document.title = c.title + ' | CSC';

      makeTitleDraggable();
    }

    function navigateTo(idx) {
      if (idx < 0 || idx >= chartsData.length) return;
      currentIndex = idx;
      updatePage();
      history.pushState({index: currentIndex}, '', chartsData[currentIndex].name + '.html');
    }

    const navigatePrev = () => navigateTo(currentIndex - 1);
    const navigateNext = () => navigateTo(currentIndex + 1);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.code === 'Space') { e.preventDefault(); navigateNext(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); navigatePrev(); }
    });

    let tsX = 0;
    const area = document.getElementById('full-capture-area');
    area.addEventListener('touchstart', e => {
      if (e.touches.length === 1) tsX = e.touches[0].screenX;
    }, { passive: true });

    area.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].screenX - tsX;
        if (Math.abs(dx) > 60) {
          if (dx < -60) navigateNext();
          else if (dx > 60) navigatePrev();
        }
      }
    });

    window.onpopstate = () => {
      currentIndex = Math.max(0, chartsData.findIndex(c => c.name === getName()));
      updatePage();
    };

    function makeTitleDraggable() {
      const titleGroup = document.querySelector('.title-group');
      if (!titleGroup || window.innerWidth >= 1280) return;

      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      titleGroup.style.position = 'absolute';
      titleGroup.style.zIndex = '50';
      titleGroup.style.cursor = 'grab';

      titleGroup.addEventListener('touchstart', (e) => {
        isDragging = true;
        const rect = titleGroup.getBoundingClientRect();
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initialLeft = rect.left;
        initialTop = rect.top;
        titleGroup.style.transition = 'none';
        titleGroup.style.cursor = 'grabbing';
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;
        const maxLeft = window.innerWidth - titleGroup.offsetWidth - 10;
        const maxTop = window.innerHeight - titleGroup.offsetHeight - 10;
        newLeft = Math.max(10, Math.min(newLeft, maxLeft));
        newTop = Math.max(10, Math.min(newTop, maxTop));
        titleGroup.style.left = newLeft + 'px';
        titleGroup.style.top = newTop + 'px';
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          titleGroup.style.cursor = 'grab';
          titleGroup.style.transition = 'left 0.15s ease, top 0.15s ease';
        }
      });
    }

    window.onload = () => { updatePage(); };

    const toggleFullScreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    function takeScreenshot() {
      const c = chartsData[currentIndex];
      const validSources = (c.sources || []).filter(s => s.text && s.text.trim() !== '');
      const img = document.getElementById('chart-image');
      
      const preload = new Image();
      preload.crossOrigin = "anonymous";
      preload.src = img.src;

      preload.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        const WIDTH = 1450;
        const PADDING_X = 60;
        const PADDING_TOP = 80;
        const PADDING_BOTTOM = 100;
        const TITLE_HEIGHT = 85;
        const SUBTITLE_HEIGHT = 45;
        const SOURCES_HEIGHT = validSources.length ? 55 : 0;

        canvas.width = WIDTH;
        canvas.height = PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + SOURCES_HEIGHT + 
                        preload.height * (WIDTH - 2 * PADDING_X) / preload.width + PADDING_BOTTOM;

        ctx.fillStyle = '#1E1E1E';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 42px Inter';
        ctx.textAlign = 'left';
        ctx.fillText(c.title, PADDING_X, PADDING_TOP + 52);

        ctx.fillStyle = '#67e8f9';
        ctx.font = '600 32px Inter';
        ctx.fillText('commoditysupercycle.com', PADDING_X, PADDING_TOP + TITLE_HEIGHT + 28);

        if (validSources.length) {
          ctx.fillStyle = '#f8fafc';
          ctx.font = '500 22px Inter';
          ctx.fillText('Sources:', PADDING_X, PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + 30);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '500 22px Inter';
          ctx.fillText(validSources.map(s => s.text).join(' · '), PADDING_X + 100, PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + 30);
        }

        const imgX = PADDING_X;
        const imgY = PADDING_TOP + TITLE_HEIGHT + SUBTITLE_HEIGHT + SOURCES_HEIGHT;
        const imgW = WIDTH - 2 * PADDING_X;
        const imgH = preload.height * (imgW / preload.width);
        
        ctx.drawImage(preload, imgX, imgY, imgW, imgH);

        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = c.name + '_CSC.png';
        link.href = dataUrl;
        link.click();
      };
    }
  </script>
</body>
