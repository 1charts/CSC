<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O&G Upstream Companies Listed Globally | CSC</title>
  <link rel="icon" type="image/png" href="https://commoditysupercycle.com/assets/logo192-C5BlHOLs.png">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body { 
      margin: 0; 
      background: #1E1E1E; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      color: #e2e8f0; 
      overflow: hidden; 
      height: 100dvh; 
      width: 100vw; 
    }

    #rotate-message { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: #1E1E1E; 
      z-index: 999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
    }

    @media (orientation: portrait) { 
      #rotate-message { display: flex; } 
    }

    .container { 
      width: 100%; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
    }

    .header-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-shrink: 0; 
      height: 55px; 
      padding: 8px 10px; 
      position: relative; 
      z-index: 10;
    }

    .title-group { 
      flex: 1; 
      min-width: 0; 
      padding-left: 8px; 
      padding-right: 70px; 
    }

    .title { 
      font-size: 16px; 
      font-weight: bold; 
      color: #f8fafc; 
      margin: 0; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .subtitle { 
      font-size: 11px; 
      color: #67e8f9; 
      text-decoration: none; 
      font-weight: bold; 
    }

    .sources { 
      font-size: 10px; 
      color: #94a3b8; 
    }

    .sources a { 
      color: #67e8f9; 
      text-decoration: none; 
    }

    .actions { 
      position: absolute !important;
      right: 8px;
      top: 8px;
      flex-direction: column; 
      gap: 6px; 
      align-items: flex-end;
      z-index: 20;
    }

    .btn { 
      background: #2a2a2a; 
      border: 1px solid #444; 
      color: #f8fafc; 
      padding: 10px;           
      border-radius: 8px;      
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      text-decoration: none; 
    }

    .btn:hover { background: #383838; }

    .btn svg { 
      width: 24px;             
      height: 24px;            
      fill: currentColor; 
    }

    .btn.nav-btn { 
      color: #67e8f9; 
      padding: 7px 11px;       
    }

    .btn.nav-btn svg { 
      width: 28px;             
      height: 28px;            
      stroke: currentColor; 
      stroke-width: 2.5; 
      fill: none; 
    }

    #full-capture-area { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      background: #1E1E1E; 
      padding: 0; 
      margin: 0;
    }

    .chart-container { 
      width: 100%; 
      flex-grow: 0; /* FIX screenshot */
      display: flex; 
      justify-content: flex-start; 
      align-items: flex-start; 
      min-height: 0; 
      padding: 0;
    }

    img { 
      width: 100%; 
      height: auto; 
      max-height: none; /* FIX screenshot */
      margin: 0; 
      display: block;
      object-fit: contain; 
      image-rendering: crisp-edges; 
    }

    /* ================= FIX SCREENSHOT ================= */
    #screenshot-title-box { 
      display: none; 
      margin-bottom: 20px; 
      width: 100%;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      padding: 0;
    }

    #ss-title { 
      font-size: 28px; 
      font-weight: bold; 
      color: #f8fafc; 
      margin-bottom: 6px; 
    }

    #ss-subtitle { 
      font-size: 15px; 
      color: #67e8f9; 
      margin-bottom: 8px; 
      font-weight: bold; 
    }

    #ss-source-bottom { 
      color: #f8fafc; 
      font-size: 14px; 
      font-weight: 500; 
    }

    .source-label { color: #f8fafc; }

    @media (min-width: 1280px) {

      .btn { padding: 6px; }
      .btn svg { width: 18px; height: 18px; }
      .btn.nav-btn { padding: 4px 8px; }
      .btn.nav-btn svg { width: 22px; height: 22px; }

      .header-row { 
        height: auto;           
        min-height: 100px;       
        padding-top: 90px;      
        padding-left: 12%;      
        padding-right: 12%;     
        position: static;
      }

      .title { font-size: 36px; }
      .subtitle { font-size: 24px; }
      .sources { font-size: 15px; }

      .actions {
        position: static !important;
        display: flex !important;
        flex-direction: row !important;
        gap: 12px !important;
      }

      #full-capture-area { padding: 15px; }

      .chart-container {
        justify-content: center;
        padding-bottom: 60px;
      }

      .chart-container img {
        max-width: 90%;
      }
    }

    @media (max-width: 1279px) {
      #full-capture-area { padding-left: 0 !important; }
      .chart-container { padding-left: 0 !important; }
      img { margin-left: 0 !important; width: 100% !important; }
    }
  </style>
</head>

<body>

  <div class="container">
    <div id="full-capture-area">
      <div id="screenshot-title-box">
        <div id="ss-title">O&G Upstream Companies Listed Globally</div>
        <div id="ss-subtitle">commoditysupercycle.com</div>
        <div id="ss-source-bottom" style="display:none;">
          <span class="source-label">Sources:</span> 
          <span id="ss-source-text"></span>
        </div>
      </div>

      <div class="chart-container">
        <img src="charts/06.png">
      </div>
    </div>
  </div>

  <script>
    function takeScreenshot() {
      const tBox = document.getElementById('screenshot-title-box');
      tBox.style.display = 'block';

      setTimeout(() => { /* FIX timing */
        html2canvas(document.getElementById('full-capture-area'), { 
          backgroundColor: "#1E1E1E", 
          scale: 2, 
          useCORS: true 
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'chart_CSC.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
          tBox.style.display = 'none';
        });
      }, 50);
    }
  </script>

</body>
</html>
